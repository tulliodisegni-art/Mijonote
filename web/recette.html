<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#fbf4ea">
<title>Une recette pour toi · Mijonote</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf4ea;--surface:#fffdf9;--ink:#2b211b;--muted:#7a6c62;--line:#eadfd2;--tomato:#c4492f;--basil:#3f6b3a;--shadow:0 6px 22px rgba(60,40,20,.08);--display:"Fraunces",Georgia,serif;--hand:"Caveat",cursive}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Figtree",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:28px 20px calc(120px + env(safe-area-inset-bottom))}
.brand{font-family:var(--display);font-size:1.1rem;color:var(--tomato);letter-spacing:.02em}
.hand{font-family:var(--hand);font-size:1.5rem;color:var(--tomato);line-height:1.1;display:block;margin-top:1.1rem}
h1{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.15;margin:.3rem 0 .6rem}
h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:1.2rem 0 .5rem}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:1rem 0 .3rem}
p{margin:0 0 1rem}.muted{color:var(--muted)}
.card{background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin:0 0 14px}
.photo{width:100%;max-height:300px;object-fit:cover;border-radius:16px;display:block;margin:0 0 .8rem}
.meta{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 0 .6rem}.meta span{background:var(--bg);border-radius:999px;padding:.2rem .7rem;font-size:.85rem}
ul.ing{margin:0;padding-left:1.1rem}ul.ing li{margin:.2rem 0}
ol.st{margin:0;padding-left:1.3rem}ol.st li{margin:.5rem 0}ol.st b{display:block}
.secret{font-family:var(--hand);font-size:1.3rem;color:var(--tomato);line-height:1.2;margin:.3rem 0}
details{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);margin:0 0 10px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:.8rem;align-items:center}summary::-webkit-details-marker{display:none}
summary img,summary .ph{width:54px;height:54px;border-radius:12px;object-fit:cover;flex:none;background:var(--bg);display:grid;place-items:center;font-size:1.4rem}
summary b{font-family:var(--display);font-weight:400;font-size:1.08rem;display:block}summary small{color:var(--muted);font-size:.82rem}
details .card{box-shadow:none;margin:0;padding-top:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:24px 20px calc(18px + env(safe-area-inset-bottom))}
.bar div{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:.4rem}
a.btn,button.btn{display:block;width:100%;border:0;font:inherit;cursor:pointer;text-align:center;border-radius:999px;padding:1rem;font-weight:700;background:var(--tomato);color:#fff;text-decoration:none;box-shadow:var(--shadow)}
.bar small{text-align:center;color:var(--muted);font-size:.82rem}
.center{text-align:center;margin-top:4rem}.big{font-size:3rem}
</style>
</head>
<body><main id="app"><p class="muted center">Chargement de la recette…</p></main>
<script>
const SB="https://vvxkkqcmjrwytagbxdfg.supabase.co",KEY="sb_publishable_A-kJQIoJXxdXmjHF8iM40g_RP6myhMo",APP="https://tulliodisegni-art.github.io/Mijonote/";
const token=location.hash.slice(1).replace(/[^0-9a-f]/g,"");
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const arr=x=>Array.isArray(x)?x:[];
const pub=p=>SB+"/storage/v1/object/public/mj-public/"+String(p).split("/").map(encodeURIComponent).join("/");
const mins=m=>!m?"":m>=60?Math.floor(m/60)+" h"+(m%60?" "+String(m%60).padStart(2,"0"):""):m+" min";
const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const ico=r=>r.type==="sucré"?"🍰":"🍲";
const qty=i=>[i.q!=null?String(i.q).replace(".",","):"",i.unite,i.nom].filter(Boolean).join(" ")+(i.note?" ("+i.note+")":"");
function body(r){
  const t=(r.prepa_min||0)+(r.cuisson_min||0)+(r.repos_min||0);
  return `<div class="meta">${[r.portions?`Pour ${r.portions}`:"",t?mins(t):"",r.difficulte||"",r.livre?"De "+r.livre:""].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")}</div>
  ${r.resume?`<p>${esc(r.resume)}</p>`:""}
  ${r.histoire?`<p class="secret">« ${esc(r.histoire)} »</p>`:""}
  <h3>Ingrédients</h3>${arr(r.ingredients).map(g=>`${g.groupe?`<b>${esc(g.groupe)}</b>`:""}<ul class="ing">${arr(g.items).map(i=>`<li>${esc(qty(i))}</li>`).join("")}</ul>`).join("")}
  <h3>Étapes</h3><ol class="st">${arr(r.etapes).map(e=>`<li>${e.titre?`<b>${esc(e.titre)}</b>`:""}${esc(e.texte)}</li>`).join("")}</ol>
  ${arr(r.secrets).length?`<h3>Ses secrets</h3>${r.secrets.map(s=>`<p class="secret">${esc(s)}</p>`).join("")}`:""}
  ${arr(r.astuces).length?`<h3>Astuces</h3><ul class="ing">${r.astuces.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}`;
}
async function main(){
  const a=$("#app");
  if(!/^[0-9a-f]{32}$/.test(token)){a.innerHTML=`<div class="center"><div class="big">🔗</div><h1>Lien incomplet</h1><p class="muted">Demande à la personne de te renvoyer son lien.</p></div>`;return}
  let d=null;
  try{const r=await fetch(SB+"/rest/v1/rpc/mj_lien",{method:"POST",headers:{"content-type":"application/json",apikey:KEY},body:JSON.stringify({p_token:token})});if(!r.ok)throw 0;d=await r.json()}
  catch{a.innerHTML=`<div class="center"><div class="big">📶</div><h1>Pas de connexion</h1><p class="muted">Vérifie internet et recharge la page.</p></div>`;return}
  const R=arr(d&&d.recettes);
  if(!R.length){a.innerHTML=`<div class="center"><div class="big">⌛</div><h1>Ce lien a expiré</h1><p class="muted">Les liens de partage durent 3 mois. Demande à la personne de te le renvoyer.</p></div>`;return}
  const de=d.de||"";
  document.title=(R.length===1?R[0].titre:R.length+" recettes")+" · Mijonote";
  a.innerHTML=`<span class="brand">Mijonote</span>
    <span class="hand">${de?esc(de)+" t'envoie":"On t'envoie"} ${R.length===1?"sa recette":R.length+" recettes"}</span>
    ${R.length===1?`<h1>${esc(R[0].titre)}</h1>${R[0]._photo?`<img class="photo" src="${esc(pub(R[0]._photo))}" alt="">`:""}<div class="card">${body(R[0])}</div>`
    :`<h1>Pour ton carnet</h1><p class="muted">Touche une recette pour l'ouvrir.</p>
      ${R.map(r=>`<details><summary>${r._photo?`<img src="${esc(pub(r._photo))}" alt="" loading="lazy">`:`<span class="ph">${ico(r)}</span>`}<span><b>${esc(r.titre)}</b><small>${esc(r.livre||"")}</small></span></summary><div class="card">${body(r)}</div></details>`).join("")}`}
    <div class="bar"><div>${ios?`<button class="btn" id="cp">Ajouter à mon carnet Mijonote</button><small id="cpt">Tu n'as pas encore Mijonote ? Demande à ${de?esc(de):"la personne"} de t'inviter.</small>`
      :`<a class="btn" href="${APP}?recette=${token}">Ajouter à mon carnet Mijonote</a><small>Tu n'as pas encore Mijonote ? Demande à ${de?esc(de):"la personne"} de t'inviter.</small>`}</div></div>`;
  const cp=$("#cp");if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(location.href)}catch{}
    cp.textContent="Lien copié ✓";$("#cpt").innerHTML="Ouvre maintenant <b>Mijonote</b> depuis ton écran d'accueil : touche <b>Ajouter</b> › <b>Lien</b> et colle-le. Les recettes arrivent dans ton carnet.";};
}
main();
</script>
</body></html>
