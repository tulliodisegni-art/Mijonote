<style>
/* Layout: phone-first kitchen app, toujours en clair. Fond crème, en-tête pêche avec des aliments qui donnent faim, étagères « idées du jour », puis la bibliothèque en cartes illustrées. Bottom bar: Recettes · Sauces · Envie · Frigo · Ajouter. Recipe = full sheet, cook mode = one big step per screen. */
:root{
  color-scheme:light;
  --bg:#fff8ef; --surface:#fffdfa; --ink:#3a2a20; --muted:#8a7565; --line:#f0e3d2;
  --basil:#3f7a4a; --basil-soft:#e6f2df;
  --tomato:#e0553a; --tomato-soft:#ffe5dc;
  --berry:#c2477a; --berry-soft:#fbe4ee;
  --saffron:#e39b1c; --saffron-soft:#fff0d1;
  --hero:#ffe9d6; --hero-2:#fff4e6; --hero-ink:#3a2a20; --hero-muted:#8a6a55;
  --danger:#b3261e;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand:"Caveat", "Segoe Print", cursive;
  --r:20px; --shadow:0 1px 2px rgba(120,70,30,.06),0 8px 22px rgba(120,70,30,.08);
  --glow:#ffd9b8; --glow-saffron:#ffe1a8; --glow-basil:#d6ecc9; --field:#f3dcc6;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#171411; --surface:#221e1a; --ink:#f3ece3; --muted:#a99d91; --line:#3a332c;
  --basil:#8cc38f; --basil-soft:#22331f; --tomato:#f08a73; --tomato-soft:#3c2219;
  --berry:#e996b8; --berry-soft:#3a1f2a; --saffron:#f2c04f; --saffron-soft:#3a2e14;
  --hero:#2c1f17; --hero-2:#1f1914; --hero-ink:#fff3dd; --hero-muted:#c4a88f; --danger:#ff8a80;
  --glow:rgba(240,138,115,.22); --glow-saffron:rgba(242,192,79,.18); --glow-basil:rgba(140,195,143,.16); --field:#3a332c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
body{background:var(--bg)}
.themebtn{position:relative;margin-top:.6rem;display:inline-flex;align-items:center;gap:.35rem;border:0;font:inherit;font-size:.82rem;font-weight:700;color:var(--hero-ink);background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:999px;padding:.3rem .8rem;cursor:pointer}
.themebtn .emo{font-size:1rem;line-height:1}
.emo{display:inline-block;line-height:1;font-size:1.9rem;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(0 3px 4px rgba(120,70,30,.18))}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:12px calc(130px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem} h2{font-size:1.35rem} h3{font-size:1.1rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hand{font-family:var(--hand);font-size:1.35rem;line-height:1}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.7rem .85rem;width:100%;box-sizing:border-box}
textarea{resize:vertical;min-height:4.5rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:0;border-radius:999px;padding:.8rem 1.25rem;font-weight:700;background:var(--basil);color:var(--bg);text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--basil-soft);color:var(--basil)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:.85rem}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;padding-block:10px 16px}

/* hero */
.heroband{background:radial-gradient(120% 90% at 100% 0%,var(--glow) 0%,transparent 55%),linear-gradient(170deg,var(--hero),var(--hero-2) 70%,var(--bg));color:var(--hero-ink);border-radius:0 0 32px 32px;margin-inline:-16px;margin-top:-12px;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 22px;position:relative;overflow:hidden}
.foodart{position:absolute;right:-6px;top:calc(4px + env(safe-area-inset-top,0px));width:150px;height:150px;pointer-events:none}
.foodart .emo{position:absolute;filter:drop-shadow(0 4px 6px rgba(120,70,30,.22))}
.heroband .hello{font-family:var(--hand);font-size:1.6rem;color:var(--tomato);position:relative}
.heroband h1{font-size:2rem;max-width:15ch;position:relative;color:var(--hero-ink)}
.heroband .stats{color:var(--hero-muted);font-size:.9rem;margin-top:.35rem;position:relative;font-variant-numeric:tabular-nums}
.search{position:relative;margin-top:16px}
.search input{border:1px solid var(--field);border-radius:999px;padding:.85rem 1rem .85rem 2.7rem;background:var(--surface);box-shadow:var(--shadow)}
.search svg{position:absolute;left:1rem;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}

.moods{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;margin:16px -16px 0;padding:2px 16px}
.moods::-webkit-scrollbar{display:none}
.mood{flex:none;border:0;border-radius:999px;padding:.5rem .95rem .5rem .6rem;font-weight:600;font-size:.9rem;background:var(--saffron-soft);color:var(--ink);display:inline-flex;align-items:center;gap:.4rem}
.mood .emo{font-size:1.25rem;filter:none}
.mood:nth-child(3n+2){background:var(--tomato-soft)}
.mood:nth-child(3n){background:var(--basil-soft)}

.avatar{font-family:var(--display);font-size:1.05rem;color:var(--tomato)}
.sharewhat{display:flex;flex-direction:column;gap:.5rem}.swopt{display:flex;flex-direction:column;gap:.15rem;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:.75rem .9rem;font:inherit;color:var(--ink);cursor:pointer}.swopt b{font-weight:700}.swopt small{color:var(--muted);font-size:.82rem;line-height:1.35}.swopt:disabled{opacity:.5}
.acc{margin-top:22px;background:var(--surface);border-radius:var(--r);padding:1rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.75rem}
.acc h2{font-size:1.15rem}
.addrs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.addrs li{display:flex;align-items:center;gap:.7rem;padding:.6rem 0;border-bottom:1px dashed var(--line)}
.addrs li:last-child{border-bottom:0}
.addrs .ai .emo{font-size:1.4rem;line-height:1}
.addrs .at{flex:1;min-width:0;display:flex;flex-direction:column}
.addrs .at small{color:var(--muted);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addform{display:flex;flex-direction:column;gap:.6rem;background:var(--bg);border-radius:14px;padding:.8rem}
.kv{display:flex;justify-content:space-between;gap:1rem;font-size:.92rem;padding:.35rem 0;border-bottom:1px dashed var(--line)}
.kv span{color:var(--muted)}
.lux-top{display:flex;justify-content:space-between;align-items:center;padding-top:6px}
.brand{font-family:var(--hand);font-size:1.45rem;color:var(--tomato)}
.roundbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
#trpill{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);z-index:70;display:flex;align-items:center;gap:.5rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.4rem .9rem;font-size:.85rem;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.08)}
#tour{position:fixed;inset:0;z-index:90}
#tour .tour-hole{position:fixed;box-sizing:border-box;border-radius:18px;box-shadow:0 0 0 9999px rgba(24,14,8,.62);transition:all .32s cubic-bezier(.2,.8,.2,1);pointer-events:none;outline:2px solid rgba(255,255,255,.85);outline-offset:2px}
#tour .tour-bub{position:fixed;box-sizing:border-box;background:var(--surface);color:var(--ink);border-radius:22px;padding:18px 18px 14px;box-shadow:0 18px 50px rgba(0,0,0,.28);transition:top .32s cubic-bezier(.2,.8,.2,1);animation:tourIn .28s ease}
#tour .tour-bub.center{padding:24px 22px 16px}
#tour .tour-k{font-family:var(--hand);font-size:1.15rem;color:var(--tomato);line-height:1}
#tour h3{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:.3rem 0 .35rem;line-height:1.2}
#tour .tour-bub.center h3{font-size:1.6rem}
#tour p{margin:0;color:var(--muted);font-size:.98rem;line-height:1.45}
#tour .tour-f{display:flex;align-items:center;gap:.6rem;margin-top:14px}
#tour .tour-prog{flex:1;max-width:90px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-right:auto}
#tour .tour-prog i{display:block;height:100%;background:var(--tomato);border-radius:2px;transition:width .3s}
#tour button{font:inherit;border:0;cursor:pointer;border-radius:999px}
#tour .tour-skip{background:none;color:var(--muted);font-weight:600;padding:.55rem .5rem}

.sauce-head{padding-top:6px}

.ssearch{display:flex;align-items:center;gap:.6rem;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:.15rem .95rem;box-shadow:var(--shadow);cursor:text}

.sseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.suse{width:86px}.suse .fl{font-size:.78rem;line-height:1.2;text-align:center}
.suse[aria-pressed="true"] .disc{border-color:var(--saffron);box-shadow:0 0 0 3px var(--saffron-soft)}
.suse[aria-pressed="true"] .fl{font-weight:700}
.qf[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sfilter{display:flex;justify-content:space-between;align-items:center;margin-top:22px;color:var(--muted);font-size:.9rem}
.sgroup{margin-top:30px}
.sgroup h3{display:flex;align-items:center;gap:.5rem;font-family:var(--display);font-weight:400;font-size:1.2rem;margin:0 0 10px}
.sgroup h3 .emo{font-size:1.15rem}.sgroup h3 small{margin-left:auto;font-family:var(--body);font-size:.8rem;color:var(--muted)}
.slist{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.scard{display:flex;align-items:center;gap:.85rem;width:100%;border:0;background:none;padding:.7rem .9rem;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.scard+.scard{border-top:1px solid var(--line)}
.sico{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:1.35rem;overflow:hidden}
.sico img{width:100%;height:100%;object-fit:cover}
.sico.sv{background:var(--saffron-soft)}.sico.sw{background:var(--berry-soft)}
.sbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:.1rem}

.scard .min{font-size:.8rem;color:var(--muted);flex:none}
.sempty{margin-top:28px;text-align:center;background:var(--surface);border-radius:var(--r);padding:28px 22px;box-shadow:var(--shadow)}

.roundbtn.langbtn{font:inherit;font-size:.74rem;font-weight:800;letter-spacing:.06em;color:var(--ink)}
.roundbtn .emo{font-size:1.15rem;line-height:1}
.lux-hello{font-size:2.35rem;line-height:1.05;margin:22px 0 0;letter-spacing:-.01em;text-wrap:balance}
.lux-hello span{display:block;font-family:var(--body);font-size:1.02rem;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:.5rem}
.envie{margin-top:22px;background:var(--surface);border-radius:26px;padding:18px 18px 14px;box-shadow:0 1px 2px rgba(120,70,30,.05),0 14px 40px rgba(120,70,30,.10);border:1px solid var(--line)}

.envie-go{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--tomato);color:#fff;font-size:1.25rem;font-weight:700;cursor:pointer}
.envie-go:disabled{background:var(--line);color:var(--muted)}
.etype{display:flex;gap:.4rem;margin-top:.7rem}.etype button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:.32rem .85rem;font:inherit;font-size:.84rem;font-weight:600;cursor:pointer}.etype button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.sugg{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;margin-top:12px;padding-inline:4px}

.suggb:hover,.suggb:focus-visible{color:var(--tomato)}
.lux-sec{margin-top:34px}
.lux-h{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:12px}
.lux-h h2{font-size:1.35rem}
.lux-n{font-family:var(--hand);font-size:1.15rem;color:var(--muted)}
.lux-sec .askclaude{margin:0}
.envie + .askclaude,.envie ~ .askclaude{margin-top:16px}
.rail{display:flex;gap:1rem;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 6px}
.rail::-webkit-scrollbar{display:none}
.fam{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;gap:.45rem;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font:inherit}

.fam .disc .emo{font-size:2rem;line-height:1}
.fam .fl{font-size:.78rem;font-weight:600;text-align:center;line-height:1.2}
.rail.pills{gap:.5rem}
.alllink{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:34px;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:none;padding:1rem 2px;font-family:var(--display);font-size:1.15rem;color:var(--ink);cursor:pointer}
.alllink span{font-family:var(--body);font-size:.9rem;color:var(--tomato);font-weight:700}
.backlink{border:0;background:none;color:var(--tomato);font:inherit;font-weight:700;padding:.4rem 0;margin-top:6px;cursor:pointer}
.lux-title{font-size:2rem;margin:6px 0 0}
.lux-sub{color:var(--muted);margin:.3rem 0 16px;font-size:.92rem}
.quick{display:flex;gap:.45rem;overflow-x:auto;scrollbar-width:none;margin:14px -16px 0;padding:2px 16px 4px}
.quick::-webkit-scrollbar{display:none}
.qf{flex:none;display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:.42rem .85rem .42rem .55rem;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
.qf .emo{font-size:1.1rem;line-height:1}
.qf[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.feature{display:grid;grid-template-columns:1fr;gap:0;width:100%;margin-top:0;border:0;padding:0;text-align:left;border-radius:24px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);cursor:pointer}
.feature .fart{position:relative;display:grid;place-items:center;min-height:190px}
.feature .fart .emo{font-size:5.2rem;filter:drop-shadow(0 10px 14px rgba(120,70,30,.22))}
.feature .kicker{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--tomato)}
.feature .fart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feature .fbody{padding:1rem 1.15rem 1.15rem;display:flex;flex-direction:column;gap:.25rem;min-width:0}
.feature .hand{color:var(--tomato);font-size:1.15rem;line-height:1}
.feature .ft{font-family:var(--display);font-size:1.55rem;line-height:1.2;text-wrap:balance}
.feature .fr{font-size:.88rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mlist{display:flex;flex-direction:column;gap:.6rem;margin-top:.7rem}
.mcard{display:flex;align-items:center;gap:.8rem;width:100%;border:0;text-align:left;background:var(--surface);color:var(--ink);border-radius:18px;padding:.55rem .8rem .55rem .55rem;box-shadow:var(--shadow);cursor:pointer;box-sizing:border-box}
.mcard .mart{position:relative;flex:0 0 64px;height:64px;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:var(--saffron-soft)}
.mcard .mart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mcard .mart .emo{font-size:2rem}
.mcard .mbody{display:flex;flex-direction:column;gap:.1rem;min-width:0}
.mcard .kicker{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--tomato)}
.mcard b{font-size:1rem;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mcard small{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard.ask{background:var(--saffron-soft);box-shadow:none}
.reroll{display:block;margin:.7rem auto 0;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.feature .fwhy{font-size:.9rem;color:var(--basil);font-weight:600;line-height:1.35}
.feature .m{font-size:.8rem;color:var(--muted);margin-top:auto}
.browse{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.bcat{display:flex;align-items:center;gap:.6rem;border:0;background:var(--surface);border-radius:16px;padding:.6rem .75rem;text-align:left;box-shadow:var(--shadow);color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.bcat .emo{font-size:1.6rem;line-height:1;flex:none}
.bcat b{display:block;font-size:.9rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.bcat small{color:var(--muted);font-size:.78rem}
.bcat span{min-width:0}
.reshead{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin:22px 0 10px}
.reshead h2{font-size:1.3rem;min-width:0;overflow-wrap:anywhere}
.reshead h2 small{font-family:var(--body);font-size:.85rem;color:var(--muted)}
.askclaude{display:flex;align-items:center;gap:.7rem;width:100%;border:1px dashed var(--saffron);background:var(--saffron-soft);color:var(--ink);border-radius:16px;padding:.7rem .9rem;text-align:left;font:inherit;cursor:pointer;margin-bottom:.8rem}
.askclaude .emo{font-size:1.5rem;line-height:1}
.askclaude b{display:block}
.askclaude small{color:var(--muted);font-size:.82rem}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 10px;gap:1rem}
.section-h h2{font-size:1.3rem}
.section-h .hand{color:var(--muted);font-size:1.15rem}
.shelf{display:flex;gap:.8rem;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 8px;scroll-snap-type:x mandatory;scroll-padding-inline:16px}
.shelf::-webkit-scrollbar{display:none}
.tile{flex:none;width:158px;scroll-snap-align:start;border:0;padding:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);text-align:left;overflow:hidden;display:flex;flex-direction:column}
.tile .art{height:104px;display:grid;place-items:center;position:relative}
.tile .art svg{width:54px;height:54px}
.tile .art .emo{font-size:3.2rem}
.ico .emo{font-size:1.85rem}
.tile .art .ver{position:absolute;top:8px;right:8px;background:var(--surface);color:var(--ink);font-size:.7rem;font-weight:700;border-radius:999px;padding:.1rem .45rem}
.tile .body{padding:.6rem .75rem .75rem;display:flex;flex-direction:column;gap:.2rem;flex:1}
.tile .t{font-weight:700;line-height:1.25;font-size:.95rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .m{font-size:.8rem;color:var(--muted);margin-top:auto;font-variant-numeric:tabular-nums}

/* art colors per family */
.c-tomato{background:var(--tomato-soft);color:var(--tomato)}
.c-basil{background:var(--basil-soft);color:var(--basil)}
.c-saffron{background:var(--saffron-soft);color:var(--saffron)}
.c-berry{background:var(--berry-soft);color:var(--berry)}
.art svg,.ico svg,.bigart svg{stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* segmented */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:.55rem .4rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button[data-t="salé"][aria-pressed="true"]{background:var(--tomato);color:#fff}
.seg button[data-t="sucré"][aria-pressed="true"]{background:var(--berry);color:#fff}
.seg button[data-m]{padding:.55rem .1rem;font-size:.86rem}
.seg button[data-m][aria-pressed="true"]{background:var(--basil);color:var(--bg)}
.srclink{display:inline-flex;align-items:center;gap:.35rem;color:var(--ink);font-weight:700;font-size:.9rem;background:var(--surface);border-radius:999px;padding:.35rem .85rem;text-decoration:none;box-shadow:var(--shadow);align-self:flex-start}
.seg .n{font-weight:500;opacity:.75;font-size:.85em}

.chips{display:flex;gap:.45rem;overflow-x:auto;padding-block:2px 4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.4rem .85rem;font-size:.88rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--saffron-soft);border-color:var(--saffron);font-weight:700}

.tag{display:inline-block;font-size:.76rem;padding:.14rem .6rem;border-radius:999px;background:var(--tomato-soft);color:var(--tomato);font-weight:700}
.tag.sucré{background:var(--berry-soft);color:var(--berry)}
.tag.base{background:var(--saffron-soft);color:var(--ink)}
.tag.plain{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}

/* library rows */
.group h3{margin:1.4rem 0 .55rem;font-size:1.08rem;display:flex;gap:.5rem;align-items:baseline}
.group h3 small{font-family:var(--body);color:var(--muted);font-size:.8rem}
.list{display:flex;flex-direction:column;gap:.55rem}
.card{display:grid;grid-template-columns:52px 1fr auto;gap:.85rem;align-items:center;background:var(--surface);padding:.6rem .85rem .6rem .6rem;text-align:left;border:0;width:100%;border-radius:16px;box-shadow:var(--shadow)}
.ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center}
.ico svg{width:28px;height:28px}
.card .t{font-weight:700;line-height:1.3}
.card .s{font-size:.83rem;color:var(--muted);margin-top:.1rem}
.card .min{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--muted);white-space:nowrap;text-align:right}
.card .ver{display:inline-block;margin-left:.35rem;font-size:.7rem;font-weight:700;background:var(--saffron-soft);color:var(--ink);border-radius:999px;padding:.05rem .45rem;vertical-align:1px}
.card>div{min-width:0}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:1.6rem 1.2rem;display:flex;flex-direction:column;gap:.8rem;align-items:flex-start;margin-top:1rem;background:var(--surface)}
.empty ol{margin:0;padding-left:1.2rem;color:var(--muted)}
.notice{background:var(--saffron-soft);border-radius:var(--r);padding:.85rem 1rem;font-size:.92rem}

/* page heads for other tabs */
.pagehead{background:radial-gradient(110% 90% at 100% 0%,var(--glow-basil) 0%,transparent 55%),linear-gradient(170deg,var(--basil-soft),var(--bg));color:var(--ink);border-radius:0 0 32px 32px;margin-inline:-16px;margin-top:-12px;margin-bottom:18px;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 20px;position:relative;overflow:hidden}
.pagehead>*{position:relative}
.pagehead>.pemo{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));font-size:3.2rem;transform:rotate(8deg)}
.pagehead h1{max-width:13ch}
.pagehead.saffron{background:radial-gradient(110% 90% at 100% 0%,var(--glow-saffron) 0%,transparent 55%),linear-gradient(170deg,var(--saffron-soft),var(--bg));color:var(--ink)}
.pagehead .hand{color:var(--tomato)}
.pagehead.saffron .hand{color:var(--tomato)}
.pagehead p{margin:.4rem 0 0;font-size:.95rem;opacity:.85;max-width:46ch}

/* tab bar — floating pill, raised above the iPhone home bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  padding:0 12px calc(env(safe-area-inset-bottom,0px) + 18px);
  background:linear-gradient(to top,var(--bg) 55%,transparent)}
.tabs nav{pointer-events:auto;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:7px;
  box-shadow:0 2px 6px rgba(60,40,20,.08),0 14px 34px rgba(60,40,20,.16)}
.tabs button{border:0;background:transparent;min-height:60px;border-radius:20px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:.72rem;font-weight:700;color:var(--muted);transition:background .2s,color .2s}
.tabs button svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.tabs button svg .fill{fill:currentColor;stroke:none;opacity:0;transition:opacity .2s}
.tabs button[aria-current="page"]{background:var(--basil-soft);color:var(--basil)}
.tabs button[aria-current="page"] svg .fill{opacity:.22}
.tabs button.add svg{width:29px;height:29px;margin-block:-1px}
.tabs button.add .disc{fill:var(--basil);stroke:none}
.tabs button.add .plus{stroke:var(--bg);stroke-width:2.2}
.tabs button.add[aria-current="page"] .disc{fill:var(--basil)}
.tabs button:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){.tabs button{transition:none}.tabs button:active{transform:none}}

/* scan / ask / fridge */
.drop{border:1.5px dashed var(--basil);border-radius:var(--r);padding:1.3rem;text-align:center;background:var(--basil-soft);display:flex;flex-direction:column;gap:.55rem;align-items:center}
.drop label{cursor:pointer}
.dish{display:flex;gap:.9rem;align-items:center;background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:.9rem 1rem}.dish.on{border-style:solid;border-color:var(--saffron)}.dish-ico{font-size:1.9rem;flex:none}.dish-t{display:flex;flex-direction:column;gap:.35rem;min-width:0;font-size:.92rem}.dish-t .btn{align-self:flex-start;padding:.5rem .95rem;margin-top:.15rem}.dish-img{position:relative;flex:none;width:76px;height:76px;border-radius:14px;overflow:hidden}.dish-img img{width:100%;height:100%;object-fit:cover;display:block}.dish-img button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:15px;line-height:1;cursor:pointer}

.sstep{display:flex;gap:.75rem;align-items:flex-start}.snum{flex:none;width:28px;height:28px;border-radius:50%;background:var(--basil);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:.9rem;margin-top:1px}.shots{display:flex;gap:.5rem;flex-wrap:wrap}.shot{position:relative;width:72px}.shot img{width:72px;height:128px;object-fit:cover;border-radius:10px;display:block;border:1px solid var(--line)}.shot .iconbtn{position:absolute;top:-8px;right:-8px;padding:.1rem .45rem;background:var(--bg)}.pastealt summary{cursor:pointer}.frames{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;border-radius:10px;overflow:hidden}.frames img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}

function tr(s){
  if(LANG!=="en"||!s)return s;
  const t=s.trim();if(!t)return s;
  let o=I18N[t];
  if(o==null)for(const [rx,rep] of I18N_RX){if(rx.test(t)){o=t.replace(rx,rep);break}}
  return o==null?s:s.replace(t,o);
}
const TR_ATTR=["placeholder","aria-label","title"];
function trNode(root){
  if(LANG!=="en"||!root)return;
  if(root.nodeType===3){const v=tr(root.nodeValue);if(v!==root.nodeValue)root.nodeValue=v;return}
  if(root.nodeType!==1||root.closest?.("[data-notr]"))return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,[data-notr]")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
  let n;while(n=w.nextNode()){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}
  const els=[root,...root.querySelectorAll("[placeholder],[aria-label],[title]")];
  for(const e of els)for(const a of TR_ATTR){const v=e.getAttribute?.(a);if(v){const x=tr(v);if(x!==v)e.setAttribute(a,x)}}
}
let trBusy=false;
new MutationObserver(ms=>{if(LANG!=="en"||trBusy)return;trBusy=true;try{for(const m of ms){if(m.type==="characterData")trNode(m.target);else m.addedNodes.forEach(trNode)}}finally{trBusy=false}})
  .observe(document.documentElement,{childList:true,subtree:true,characterData:true});
document.addEventListener("DOMContentLoaded",()=>trNode(document.body));if(document.body)trNode(document.body);
function setLang(l){LANG=l==="en"?"en":"fr";ls.set("lang",LANG);document.documentElement.lang=LANG;document.title="Mijonote";
  if(LANG==="fr"){location.reload();return}relocalize();render();trNode(document.body);if(openId)openRecipe(openId,true);trQueue()}
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-lang]");if(b)setLang(b.dataset.lang)});

function fmtQ(q,u){
  if(q==null||q===""||isNaN(q))return "";
  q=Number(q);
  if(/^(g|kg|ml|cl|l)$/.test(u||"")&&q<20)return String(Math.max(q>0?.1:0,Math.round(q*10)/10)).replace(".",",");
  if(q>=20)return String(Math.round(q/ (q>=200?5:1))*(q>=200?5:1));
  if(q>=5)return String(Math.round(q*2)/2).replace(".5","½");
  const w=Math.floor(q),f=q-w,fr=[[0,""],[.25,"¼"],[1/3,"⅓"],[.5,"½"],[2/3,"⅔"],[.75,"¾"],[1,""]];
  let best=fr[0];for(const p of fr)if(Math.abs(f-p[0])<Math.abs(f-best[0]))best=p;
  const whole=best[0]===1?w+1:w;
  return (whole?String(whole):"")+best[1]||(q>0?"⅛":"0");
}

/* light DOM patch: keeps the nodes that did not change */
function morph(from,to){
  const A=[...from.childNodes],B=[...to.childNodes];
  for(let i=0;i<B.length;i++){
    const x=A[i],y=B[i];
    if(!x){from.appendChild(y);continue}
    if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName||(x.nodeType===1&&(x.id!==y.id||x.getAttribute("type")!==y.getAttribute("type")))){from.replaceChild(y,x);continue}
    if(x.nodeType===3||x.nodeType===8){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;continue}
    if(x.nodeType!==1)continue;
    let ch=false;
    for(const at of [...x.attributes])if(!y.hasAttribute(at.name)){x.removeAttribute(at.name);ch=true}
    for(const at of [...y.attributes])if(x.getAttribute(at.name)!==at.value){x.setAttribute(at.name,at.value);ch=true}
    if(ch)x.onclick=x.onchange=x.oninput=x.onsubmit=null; // bind() sets them again from the new attributes
    const tag=x.nodeName;
    if(tag==="INPUT"){const ty=x.type;if(ty==="checkbox"||ty==="radio")x.checked=y.hasAttribute("checked");else if(ty!=="file"&&x!==document.activeElement&&x.value!==(y.getAttribute("value")||""))x.value=y.getAttribute("value")||"";continue}
    if(tag==="TEXTAREA"){if(x!==document.activeElement&&x.value!==y.value)x.value=y.value;continue}
    if(tag==="SELECT"){morph(x,y);const o=y.querySelector("option[selected]");x.selectedIndex=o?[...y.options].indexOf(o):0;continue}
    if(tag==="VIDEO"||tag==="AUDIO"||tag==="svg"||tag==="SVG"){if(x.outerHTML!==y.outerHTML)from.replaceChild(y,x);continue}
    morph(x,y);
  }
  for(let i=A.length-1;i>=B.length;i--)A[i].remove();
}
// while typing in « Envie », the form holding the field stays in place and only the rest of the page is redrawn:
// recreating the field on every letter made the iPhone keyboard lose letters, autocorrect and dictation
function renderKeep(el,v){
  const a=$("#app"),keep=el.closest("#envieForm");
  if(!keep||keep.parentNode!==a)return false;
  const t=document.createElement("div");t.innerHTML=v();
  const fresh=[...t.children].find(n=>n.id===keep.id);if(!fresh)return false;
  const go=keep.querySelector(".envie-go"),ng=fresh.querySelector(".envie-go");if(go&&ng)go.disabled=ng.disabled;
  while(a.firstChild!==keep)a.firstChild.remove();while(keep.nextSibling)keep.nextSibling.remove();
  while(t.firstChild!==fresh)a.insertBefore(t.firstChild,keep);fresh.remove();a.append(...t.childNodes);
  bind(a);if(typeof maybeTour==="function")maybeTour();
  return true;
}

/* daily picks */
function seasonNow(){const m=new Date().getMonth();return m<2||m===11?"hiver":m<5?"printemps":m<8?"été":"automne"}
function daily(list,n,salt){
  const d=new Date(),seed=d.getFullYear()*400+d.getMonth()*32+d.getDate()+salt;
  const h=s=>{let x=seed;for(const c of s)x=(x*31+c.charCodeAt(0))>>>0;return x};
  return [...list].sort((a,b)=>h(a.id)-h(b.id)).slice(0,n);
}

const GOAL_EMO={"riche en protéines":"💪","récup après le sport":"🏋️","énergie avant le sport":"⚡","léger":"🥗","healthy":"🍏","végétarien":"🌱"};
const GOAL_SHORT={"riche en protéines":"Protéiné","récup après le sport":"Récup","énergie avant le sport":"Énergie","léger":"Léger","healthy":"Équilibré","végétarien":"Végétarien"};
const HEAVY=/croque|frit|friture|beignet|raclette|tartiflette|fondue|carbonara|burger|pizza|dauphinois|quiche lorraine|nugget|panure|pané|cordon bleu|lasagne|mac.?and.?cheese|aligot|churros|kebab|feuillet|brioche|croissant|chips|fried|fries|breaded|lasagna|doughnut|donut/;
/* Tags from Claude are only a hint: a goal also needs the numbers to match (lean protein, really light...). */
/* Repères : UE 1924/2006 (riche en protéines ≥ 20 % de l'énergie, source ≥ 12 %), ANSES (lipides 35–40 % de l'énergie, saturés ≤ 12 %),
   OMS (lipides ≤ 30 %, saturés ≤ 10 %, sucres libres < 10 %), ISSN (20–40 g de protéines par repas pour un sportif). */
function macroShares(n){const K=+n.kcal||0;return K?{K,P:+n.proteines||0,pP:(+n.proteines||0)*4/K,pG:(+n.glucides||0)*4/K,pL:(+n.lipides||0)*9/K,pS:n.satures!=null?(+n.satures)*9/K:null}:null}
function fits(r,k){
  if(k==="végétarien")return arr(r.sport).includes(k);
  const n=r.nutrition,m=n&&macroShares(n);if(!m)return false;
  if(HEAVY.test(norm((r._raw||r).titre))||HEAVY.test(norm(r.titre)))return false;
  // sweets and whole-batch recipes (a full cake, a jar of jam) are never a sport or light meal
  if(k!=="healthy"&&(/confiserie|biscuit|sauce/.test(norm(r.categorie||""))||/confiture|nougat|praline|caramel|pate a tartiner/.test(norm(r.titre))))return false;

const ASSET_RX=/^[0-9a-f]{32}$/;
const blobB64=b=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]||"");r.onerror=()=>ko(r.error);r.readAsDataURL(b)});
// the whole cookbook (or a gift copy) as one file: documents + photos
async function packCarnet(gift){
  const pack=list=>list.map(({id,...d})=>({id,d}));
  let docs;
  if(gift){const rs=(gift==="coeur"?recRaw.filter(isPerso):recRaw).map(({faite,maNote,partageePar,...r})=>r),who=new Set(rs.map(r=>r.livre).filter(Boolean));
    docs={recettes:pack(rs),proches:pack(Object.entries(proches).filter(([id,d])=>who.has(d.nom)).map(([id,d])=>({id,...d})))}}
  else{docs={recettes:pack(recRaw),albums:pack(st.album.list),liens:pack(liens),proches:pack(Object.entries(proches).map(([id,d])=>({id,...d}))),reglages:[]};
    for(const k of ["gouts","tuto"]){try{const g=await db.collection("reglages").doc(k).get();if(g.exists)docs.reglages.push({id:k,d:g.data()})}catch{}}}
  const ids=new Set();JSON.stringify(docs,(k,v)=>{if(typeof v==="string"&&ASSET_RX.test(v))ids.add(v);return v});
  const blobs={};let n=0;
  for(const id of ids){
    try{const r=await fetch(pic(id));if(r.ok){const b=await r.blob();blobs[id]={type:b.type||"image/jpeg",data:await blobB64(b)}}}catch{}
    n++;if(n%5===0||n===ids.size){st.bk=L(`Photos : ${n} sur ${ids.size}…`,`Photos: ${n} of ${ids.size}…`);render()}
  }
  return {docs,blobs,blob:new Blob([JSON.stringify({app:"mijonote",v:1,date:Date.now(),...(gift?{cadeau:gift}:{}),docs,blobs})],{type:"application/json"})};
}

  if(d==="pesco"&&RX.viande.test(t))bad.push(L("viande","meat"));
  if(d==="sansporc"&&RX.porc.test(t))bad.push(L("porc","pork"));

function pickToday(plats,tags,slot,skip=[]){
  const d=new Date(),wd=d.getDay(),weekend=wd===0||wd===6,evening=slot?slot==="diner"||slot==="dessert":d.getHours()>=16,season=seasonNow();
  const seed=d.getFullYear()*400+d.getMonth()*32+d.getDate()+(ls.get("reroll",{})[todayKey()]||0)*7919+(slot?slot.length*131:0);
  if(slot){const S=SLOTS[slot];plats=plats.filter(r=>S.ok(r)&&!skip.includes(r.id))}

    if(has("calm"))s+=total(r)>=45||r.difficulte==="moyen"?2:0;
    if(has("cold"))s+=comfy(r)?3:(r.categorie==="Salade"?-2:0);

    if(has("light"))s+=fits(r,"léger")||r.categorie==="Salade"?4:(comfy(r)?-2:0);
    if(has("tired"))s+=(quickOk(r)?3:(total(r)>45?-3:0))+(r.difficulte==="facile"?2:0);
    if(has("sick"))s+=(r.categorie==="Soupe"?4:0)+(arr(r.envies).some(e=>/réconfort|léger/.test(e))?2:0)+(arr(r.envies).includes("épicé")?-2:0);
    if(has("treat"))s+=arr(r.envies).includes("gourmand")?4:(fits(r,"léger")?-1:0);
    if(has("family"))s+=(r.difficulte==="facile"?1.5:0)+((r.portions||4)>=4?2:0)+(arr(r.envies).includes("épicé")?-1.5:0);
    if(has("solo"))s+=((r.portions||4)<=2?2:0)+(quickOk(r)?1.5:0);
    if(has("movie"))s+=(r.categorie==="Apéritif"||arr(r.themes).some(t=>/apéro/i.test(t))?2.5:0)+(/pizza|burger|tacos|wrap|croque|nachos|fajita|hot.?dog|quesadilla/i.test(r.titre)?3:0);
    if(has("love"))s+=(r.difficulte==="moyen"?1.5:0)+(arr(r.themes).some(t=>/romanti|amoureux|saint-valentin|chic/i.test(t))||arr(r.envies).includes("festif")?2.5:0)+(r.portions===2?1:0);
    if(has("guests"))s+=r.difficulte&&r.difficulte!=="facile"||arr(r.themes).some(t=>/recevoir|fête|apéro/i.test(t))?2.5:0;
    if(!tags.length){if(!weekend&&evening)s+=quickOk(r)?2:0;if(weekend)s+=total(r)>=45?1:0}
    if(!slot){if(evening&&r.type==="salé")s+=.8;if(!evening&&d.getHours()>=15&&r.type==="sucré")s+=1.5}
    if(slot==="diner")s+=(fits(r,"léger")?1:0)+(r.nutrition&&+r.nutrition.kcal>900?-1.5:0);

  };

function resultsHTML(res,fridge,t){
  const byId=Object.fromEntries(recettes.map(r=>[r.id,r]));
  let picks=arr(res.recettes).filter(p=>byId[p.id]&&(!t||t==="tout"||byId[p.id].type===t));
  const split=t==="tout"&&new Set(picks.map(p=>byId[p.id].type)).size>1;
  if(split)picks=[...picks.filter(p=>byId[p.id].type==="salé"),...picks.filter(p=>byId[p.id].type!=="salé")];
  return `<div class="stack" style="margin-top:.4rem">
    ${fridge&&arr(res.vus).length?`<div><div class="eyebrow" style="margin-bottom:.35rem">Vu dans ton frigo</div><div class="row" style="gap:.35rem">${res.vus.map(v=>`<span class="tag plain">${esc(v)}</span>`).join("")}</div></div>`:""}
    ${res.message?`<p class="answer" style="margin:.2rem 0">${esc(res.message)}</p>`:""}
    ${picks.length&&!split?`<div class="eyebrow">Dans tes livres</div>`:""}
    ${picks.map((p,i)=>{const r=byId[p.id];const miss=arr(p.manquants);return `${split&&(i===0||byId[picks[i-1].id].type!==r.type)?`<div class="eyebrow">${r.type==="salé"?L("Salé","Savoury"):L("Sucré","Sweet")}</div>`:""}<button class="pick" data-open="${esc(r.id)}">
      <div class="row"><span class="tag ${esc(r.type)}">${esc(r.type)}</span><span class="muted" style="font-size:.85rem">${esc(r.livre?byLine({...r,auteur:r.auteur||authorOf(r.livre)}):"")}${r.page?" · p. "+esc(r.page):""}${total(r)?" · "+mins(total(r)):""}</span></div>
      <span class="t">${esc(r.titre)}</span><span>${esc(p.raison||"")}</span>
      ${fridge?(miss.length?`<span class="miss">Il te manque : ${esc(miss.join(", "))}</span>`:`<span class="ok">Tu as tout ce qu'il faut</span>`):""}
    </button>`}).join("")}
    ${res.idee?`<div class="eyebrow">Une idée hors des livres</div>
      <button class="pick idea" data-idea-open="${fridge?"fridge":"ask"}"><span class="t">${esc(res.idee.titre)}</span><span>${esc(res.idee.resume)}</span><span class="muted" style="font-size:.85rem">${mins(total(res.idee))} · ${res.idee.etapes.length} étapes — touche pour la voir</span></button>`:""}
  </div>`;
}

    const k=b.dataset.alb,i=+b.dataset.i;

    if(k==="new"){A.cur=newAlbum();A.link="";A.q=""}
    else if(k==="open"){const x=A.list.find(x=>x.id===b.dataset.id);if(x){A.cur={...newAlbum(),...JSON.parse(JSON.stringify(x))};A.link="";A.q=""}}
    else if(k==="theme"){a.theme=b.dataset.k;albumDirty()}
    else if(k==="bgreset"){a.bgc="";albumDirty()}
    else if(k==="covrm"){a.cover="";albumDirty()}
    else if(k==="phrm"){const l=arr((a.photos||{})[b.dataset.id]);l.splice(i,1);a.photos[b.dataset.id]=l;albumDirty()}
    else if(k==="bubadd"){const t=prompt(L("Le texte de ta bulle (un souvenir, un secret, un clin d'œil…)","Your bubble's text (a memory, a secret, a wink…)"),"");if(!t||!t.trim())return;a.bulles=a.bulles||{};a.bulles[b.dataset.id]=[...arr(a.bulles[b.dataset.id]),t.trim()];albumDirty()}
    else if(k==="bubrm"){const l=arr((a.bulles||{})[b.dataset.id]);l.splice(i,1);a.bulles[b.dataset.id]=l;albumDirty()}
    else if(k==="addlivre"){const ids=recettes.filter(r=>!isBase(r)&&r.livre===b.dataset.l).map(r=>r.id);a.recettes=[...a.recettes,...ids.filter(id=>!a.recettes.includes(id))];albumDirty()}
    else if(k==="up"||k==="down"||k==="rm"){
      // i is a position in the list shown (recipes that still exist and are personal), not in a.recettes
      const vis=a.recettes.filter(id=>{const r=recettes.find(x=>x.id===id);return r&&isPerso(r)}),j=a.recettes.indexOf(vis[i]);if(j<0)return;
      if(k==="rm")a.recettes.splice(j,1);
      else{const o=a.recettes.indexOf(vis[k==="up"?i-1:i+1]);if(o<0)return;[a.recettes[o],a.recettes[j]]=[a.recettes[j],a.recettes[o]]}
      albumDirty()}
    else if(k==="pdf"){albumPdf();return}
    else if(k==="preview"){albumPreview();return}
    else if(k==="set"){a[b.dataset.f]=b.dataset.v;albumDirty()}
    else if(k==="reset"){const was={edits:a.edits,pos:a.pos,sty:a.sty};a.edits={};a.pos={};a.sty={};albumDirty();toast(L("Retouches annulées","Edits undone"),{fn:()=>{Object.assign(a,was);albumDirty();render()}})}
    else if(k==="del"){await albumSave();const {id,...data}=JSON.parse(JSON.stringify(A.list.find(x=>x.id===a.id)||a));try{await delWithUndo("albums",a.id,data,L("Livre supprimé, tes recettes restent","Book deleted, your recipes stay"))}catch{}A.cur=null}
    render();if(["new","open"].includes(k))window.scrollTo(0,0);
  });
}

const RULES=`1. Recopie fidèlement les quantités et ingrédients, sans rien inventer. Convertis les fractions en décimales (½ → 0.5). Si une quantité n'est pas donnée, mets q à null.
2. Réécris la méthode pour qu'elle soit très facile à suivre en cuisinant, sans forcément suivre l'ordre du livre :
   - une action principale par étape, dans l'ordre réel de réalisation ;
   - indique dans le texte ce qu'on peut faire en parallèle pendant une cuisson ou un repos ;
   - précise températures, temps et repères visuels (« jusqu'à ce que ce soit doré ») ;
   - mets dans miseEnPlace tout ce qui doit être fait avant de commencer (préchauffer, sortir le beurre, peser, éplucher…) ;
   - MAIS chaque étape doit se suffire à elle-même : répète dans l'étape concernée la température exacte ET le mode du four (« Enfourner à 150 °C, chaleur tournante, 20 min »), les températures au thermomètre (« cuire jusqu'à 118 °C »), les tailles de moule et les temps ;
   - duree_min = durée d'attente/cuisson de l'étape s'il y en a une, sinon null ;
   - ingredients de chaque étape = ceux utilisés à cette étape, avec quantité.
3. Si le texte est coupé ou illisible, fais au mieux et ajoute une astuce commençant par « À vérifier : ».
   Recette ÉCRITE À LA MAIN (fiche, carnet, cahier de famille) : déchiffre-la mot à mot, lentement. Repère d'abord le style de l'écriture (forme des lettres et des chiffres : 1/7, 4/9, 0/6, u/n, a/o, abréviations comme « c. à s. », « cs », « cc », « gr », « 1/2 l ») et sers-t'en pour toute la page. Pour un mot difficile, choisis la lecture la plus logique en cuisine (ingrédient courant, quantité cohérente avec les autres : 250 g de farine plutôt que 25 g pour un gâteau, four à 180 °C plutôt qu'à 18). Les mots barrés sont annulés, les ajouts dans la marge ou au-dessus de la ligne comptent. N'ajoute jamais un ingrédient ou une étape qui n'est pas écrit. Garde le titre tel qu'il est écrit (ex. « Gâteau de Didi »). Pour chaque mot ou quantité dont tu n'es pas sûr, ajoute une astuce « À vérifier : j'ai lu "…" (peut-être "…") ».
4. Classe la recette (type, categorie, themes, envies) avec soin.
5. Une recette en plusieurs parties (ex. « La ganache », « Le biscuit », « La crème », « Montage ») est UNE SEULE recette : chaque partie devient un groupe d'ingrédients (le "groupe" porte son nom) et les étapes suivent l'ordre réel de réalisation. Ne la découpe JAMAIS en plusieurs recettes.
6. Seulement si la page donne en plus une base classique qu'on refait souvent seule, sous son nom habituel (béchamel, mayonnaise, vinaigrette, pâte brisée ou sucrée, crème pâtissière), ajoute-la AUSSI comme recette séparée, avec seulement ses ingrédients et ses étapes, "base": true et "origine": titre de la recette principale. Jamais pour une partie propre à ce dessert ou ce plat (ganache, crème au fromage, biscuit, garniture, glaçage…). Dans le doute, ne l'ajoute pas.
7. RELIS-TOI avant de répondre, ligne par ligne contre la page : chaque quantité, chaque température (avec le mode : chaleur tournante, sole, gril…), chaque durée, chaque taille de moule, chaque repère et chaque étape du livre doit se retrouver dans ta recette. Reformuler ne doit jamais faire perdre une information.`;
async function extract(){
  const s=st.scan;s.busy=true;s.err="";s.found=null;s.report="";s.saved=null;render();
  ctl=new AbortController();
  const prompt=`Tu es un chef qui transcrit des recettes de livres de cuisine pour une appli mobile.
Les ${s.files.length} image(s) sont des photos de page(s) d'un livre de cuisine, d'une recette écrite à la main${s.livre?` (« ${s.livre} »)`:""}, ou des captures d'écran d'un post (Instagram, TikTok, Facebook…). Elles peuvent se suivre (recette sur deux pages, ou légende sur plusieurs captures).
Si ce sont des captures d'écran d'un réseau social (interface de l'appli visible : likes, commentaires, nom du compte…), ignore l'interface et ajoute à la recette "reseau": {"plateforme": "Instagram" | "TikTok" | "Facebook" | "YouTube" | "Pinterest", "createur": "@compte" ou null} ; sinon "reseau": null.
${roleLines(s.files,1,s.files.length).replace(/photo (\d+)/g,"image $1")}

${s.dish?`IMPORTANT : l'image n° ${s.files.length+1} (la dernière) n'est PAS une page à lire : c'est la photo du plat terminé, prise à côté de la recette. Utilise-la pour "photo" de la recette qu'elle montre (la recette principale s'il y en a plusieurs), avec "image": ${s.files.length+1} et "box" = le cadre du plat dans cette image ([0,0,1,1] si le plat remplit la photo, et enlève les bords de page ou le texte autour). Ne la mets jamais sur une étape.
`:""}${RULES}

Réponds UNIQUEMENT avec ce JSON : {"recettes":[ RECETTE, ... ]} où chaque RECETTE suit ce schéma, plus "page": numéro imprimé sur la page s'il est visible, sinon null :
${SCHEMA}
${L("Tout en français.","Free text in English; fixed-list values stay in French exactly as listed.")}`;
  try{
    const imgs=[...s.files.map(f=>f.file),...(s.dish?[s.dish.file]:[])];
    const out=await sample.json(prompt,{images:imgs,signal:ctl.signal,modelTier:"complex"});
    const list=[];
    for(const raw of arr(out?.recettes)){
      const r={...clean(raw),page:s.page.trim()||(raw.page!=null?String(raw.page):"")};
      if(!r.ingredients.length&&!r.etapes.length)continue;
      await attachPhoto(r,raw,imgs);
      const rs=raw.reseau;if(rs&&rs.plateforme){const c=String(rs.createur||"").trim();hide(r,"_social",{plat:String(rs.plateforme),createur:c&&!c.startsWith("@")?"@"+c:c})}
      list.push(r);
    }
    // the dish photo always ends up as a cover: on the recipe Claude chose, else on the main one
    const dishN=s.files.length+1,used=arr(out?.recettes).some(x=>Number(x?.photo?.image)===dishN);
    const main=list.find(r=>!r.base)||list[0];
    if(s.dish&&main&&!used){const b=await cropBlob(s.dish.file,[0,0,1,1]);if(b){hide(main,"_photo",b);main._preview=URL.createObjectURL(b)}}
    // same book, same title = already saved: skip it, like the batch reading does
    const lv=norm(s.livre.trim()),have=recettes.filter(r=>norm(r.livre||"")===lv).map(r=>({titre:(r._raw||r).titre,page:r.page}));
    const fresh=list.filter(r=>!have.some(x=>sameDish(x,r))),dup=list.length-fresh.length;
    if(dup)s.report=L(`${dup} recette${dup>1?"s":""} déjà dans ce livre, ignorée${dup>1?"s":""}.`,`${dup} recipe${dup>1?"s":""} already in this book, skipped.`);
    if(!list.length)s.err="Aucune recette trouvée sur ces photos. Vérifie qu'elles sont nettes et bien cadrées.";
    else if(fresh.length)s.found=fresh;
  }catch(e){s.err=errText(e)}
  s.busy=false;render();
}

function loadPdfJs(){
  if(pdfjsP)return pdfjsP;

  pdfjsP=add(base+"pdf.min.js").then(()=>add(base+"pdf.worker.min.js")).then(()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js";return window.pdfjsLib}).catch(e=>{pdfjsP=null;throw e});
  return pdfjsP;
}
async function openPdf(file){
  const s=st.scan;
  s.files.forEach(f=>URL.revokeObjectURL(f.url));s.files=[];setDish(null);s.found=null;s.err="";s.report="";s.saved=null;
  s.pdf={name:file.name,doc:null,n:0,from:1,to:1,err:""};

  }catch(e){s.pdf.err=e?.name==="PasswordException"?"Ce PDF est protégé par un mot de passe.":"Impossible d'ouvrir ce PDF. Essaie avec des photos des pages."}

async function renderPage(doc,n){
  const p=await doc.getPage(n);
  const v1=p.getViewport({scale:1});
  const scale=Math.min(3,Math.max(.5,Math.sqrt(1.8e6/(v1.width*v1.height))));
  const v=p.getViewport({scale});
  const c=document.createElement("canvas");c.width=Math.floor(v.width);c.height=Math.floor(v.height);
  const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
  await p.render({canvasContext:ctx,viewport:v}).promise;
  let text="";
  try{const tc=await p.getTextContent();text=tc.items.map(i=>i.str+(i.hasEOL?"\n":" ")).join("").replace(/[ \t]+/g," ").trim()}catch{}
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));
  p.cleanup();c.width=c.height=0;
  return {blob,text};
}
const batchSize=()=>Math.max(1,Math.min(imgLimits?.maxCount||4,4));
const READ_CONC=3;
const readMinutes=n=>{const B=batchSize(),st=B>=4?B-2:B>1?B-1:1,w=Math.max(1,Math.ceil(Math.max(0,n-B)/st)+1);return Math.max(1,Math.round(Math.ceil(w/READ_CONC)*0.7))};
// image envoyée à Claude pour la lecture : plus légère (l'originale sert au recadrage de la photo du plat)
async function shrinkForRead(blob,max=1600){
  try{
    const bm=await createImageBitmap(blob),k=Math.min(1,max/Math.max(bm.width,bm.height));
    if(k>=1&&blob.size<700000)return blob;
    const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
    c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(x=>r(x||blob),"image/jpeg",.8));
  }catch{return blob}
}

async function cropBlob(blob,box,cover){

    let [x0,y0,x1,y1]=arr(box).map(Number);
    if([x0,y0,x1,y1].some(v=>isNaN(v)))return null;
    x0=Math.max(0,Math.min(1,x0));x1=Math.max(0,Math.min(1,x1));y0=Math.max(0,Math.min(1,y0));y1=Math.max(0,Math.min(1,y1));

    const bm=await createImageBitmap(blob);
    let sx=x0*bm.width,sy=y0*bm.height,sw=(x1-x0)*bm.width,sh=(y1-y0)*bm.height;
    if(cover){

      const ix=sw*.04,iy=sh*.04;sx+=ix;sy+=iy;sw-=2*ix;sh-=2*iy;
      const R=sh>sw*1.15?4/5:4/3;
      if(sw/sh>R){const w=sh*R;sx+=(sw-w)/2;sw=w}else{const h=sw/R;sy+=(sh-h)/2;sh=h}
    }
    const k=Math.min(1,(cover?1600:1400)/Math.max(sw,sh));
    const c=document.createElement("canvas");c.width=Math.round(sw*k);c.height=Math.round(sh*k);
    const g=c.getContext("2d");
    if(cover&&"filter" in g)g.filter="saturate(1.1) contrast(1.05) brightness(1.02)";
    g.imageSmoothingQuality="high";
    g.drawImage(bm,sx,sy,sw,sh,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",.86));
  }catch{return null}
}

async function stepPhoto(r,i,inp){

    const etapes=arr((r._raw||r).etapes).map((e,k)=>k===i?{...e,image:id}:{...e});
    await db.collection("recettes").doc(r.id).update({etapes});
    showRecipe(loc({...(r._raw||r),etapes}),{refresh:true});toast("Photo ajoutée à l'étape "+(i+1));
  }catch(e){lab.classList.remove("busy");lab.firstChild.nextSibling.textContent=" Réessayer";toast("La photo n'a pas pu être envoyée")}

async function drawSchemas(r,btn){
  if(!sample||!assets||!db)return;
  btn.classList.add("busy");btn.lastChild.textContent=" Claude dessine…";
  const steps=arr((r._raw||r).etapes);
  const prompt=`Tu es illustrateur culinaire. Pour la recette « ${r.titre} », dessine un schéma SVG simple et clair pour chaque étape ci-dessous, comme dans un livre de cuisine pédagogique.
Style : dessin plat et propre, traits arrondis épaisseur 3 à 4, couleur de trait #3a2a20, aplats doux parmi #ffe9d6 #e6f2df #ffe5dc #fff0d1 #f0e3d2, accents #e0553a #3f7a4a #e39b1c. Fond #fffaf3 sur tout le cadre.
Montre le geste ou le résultat (bol, fouet, casserole, poêle, four, plaque, couteau, mains, flèches de mouvement, petites étiquettes de 1 à 3 mots en ${((r._raw||r).lang||"fr")==="en"?"anglais":"français"} si utile, police sans-serif, taille 16 minimum). Pas de visages ni de texte long.
Contraintes : <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"> ... </svg>, uniquement des formes SVG de base (rect, circle, ellipse, path, line, polyline, polygon, text, g), pas d'image, pas de script, pas de lien, moins de 4000 caractères chacun.
Étapes :
${steps.map((e,i)=>`${i+1}. ${e.titre} : ${e.texte}`).join("\n")}
Réponds UNIQUEMENT avec ce JSON : {"schemas":[ un SVG (chaîne) par étape, dans l'ordre, ${steps.length} au total ]}`;
  try{
    const out=await sample.json(prompt,{modelTier:"complex",cache:false,noLang:true});
    const svgs=arr(out?.schemas);
    const etapes=[];let n=0;
    for(let i=0;i<steps.length;i++){
      const e={...steps[i]},svg=String(svgs[i]||"").trim();
      if(!e.image&&/^<svg[\s>]/i.test(svg)&&/<\/svg>$/i.test(svg)){
        try{e.image=(await assets.upload(new Blob([svg],{type:"image/svg+xml"}),{type:"image/svg+xml"})).id;n++}catch{}
      }
      etapes.push(e);
    }
    if(!n)throw {code:"invalid_json"};
    await db.collection("recettes").doc(r.id).update({etapes});
    showRecipe(loc({...(r._raw||r),etapes}),{refresh:true});toast(n+" schéma"+(n>1?"s":"")+" ajouté"+(n>1?"s":""));
  }catch(e){btn.classList.remove("busy");btn.lastChild.textContent=" Réessayer les schémas";toast(errText(e))}
}

async function shopAct(a,i,el){
  const S=shop;if(!S)return;S.err="";
  if(a==="close"){shop=null;$("#shopZone").innerHTML="";return}
  if(a==="copy"){try{await navigator.clipboard.writeText(shopListText());toast("Liste copiée")}catch{toast("Copie impossible ici")}return}
  if(a==="copylink"){const u=S.done?.link||"https://www.carrefour.fr/mon-panier";try{await navigator.clipboard.writeText(u);toast("Lien copié : colle-le dans ton navigateur")}catch{prompt("Copie ce lien :",u)}return}
  if(a==="mode"){S.mode=el.dataset.m;S.stores=null;return renderShop()}
  if(a==="fav"&&favs()[i]&&!favs()[i].fsid){const f=favs()[i];S.mode="LAD";S.where=f.where||"";S.pendingFav=i;return shopAct("find")}
  if(a==="fav"){const f=favs()[i];if(!f)return;S.cfg={...f};ls.set("shopcfg",S.cfg);S.mode=f.mode;S.where=f.where||"";S.stage="list";S.done=null;S.anchor=true;S.items.forEach(x=>{x.opts=[];x.pick=0});renderShop();return loadProducts()}
  if(a==="unfav"){const F=favs();F.splice(i,1);ls.set("shopfavs",F);return renderShop()}
  if(a==="favadd"){S.naming=true;renderShop();setTimeout(()=>$("#favName")?.focus(),0);return}
  if(a==="favsave"){const n=($("#favName")?.value||"").trim()||(S.cfg.mode==="DRIVE"?S.cfg.name:L("Maison","Home"));const F=favs().filter(f=>favKey(f)!==favKey(S.cfg));F.push({...S.cfg,label:n});ls.set("shopfavs",F.slice(-8));S.naming=false;toast("Ajouté aux favoris");return renderShop()}
  if(a==="change"){S.stage="where";S.stores=null;S.mode=S.cfg?.mode||"DRIVE";S.anchor=true;return renderShop()}
  if(a==="back"){S.stage="list";return renderShop()}
  if(a==="minus"){S.items[i].qty=Math.max(1,S.items[i].qty-1);S.done=null;return renderShop()}
  if(a==="plus"){S.items[i].qty=Math.min(99,S.items[i].qty+1);S.done=null;return renderShop()}
  if(a==="find"){
    const q=(S.where||"").trim();if(!q)return;
    S.busy="find";renderShop();
    try{
      await cf("set_pickup_mode",{pickup_mode:S.mode},true);
      if(S.mode==="DRIVE"){
        const out=await cf("search_store",{query:q,serviceType:"DRIVE",radius:15000});
        S.stores=arr(findKey(out,"stores")).filter(st=>arr(st.services).length).slice(0,8);
      }else{
        const out=await cf("auto_select_delivery_location",{query:q});
        const st=findKey(out,"auto_selected_store");
        if(!st)throw {message:"adresse introuvable"};
        await chooseStore(st,"LAD",findKey(out,"min_order_message")||"");return;
      }
    }catch(e){S.err=e?.code?cfErr(e):(e?.message==="adresse introuvable"?"Adresse introuvable. Mets la rue, le code postal et la ville.":cfErr(e))}
    S.busy="";renderShop();return;
  }
  if(a==="store"){S.busy="find";renderShop();try{await chooseStore(S.stores[i],"DRIVE","")}catch(e){S.err=cfErr(e);S.busy="";renderShop()}return}
  if(a==="cart")return addCart();
}
async function chooseStore(st,mode,min){
  const S=shop,fsid=arr(st.services)[0]?.facility_service_id;
  if(!fsid)throw {message:"magasin sans service"};
  try{await cf("set_store",{store:{id:String(st.id),name:st.name,city:st.city,facility_service_id:fsid}},true)}catch{}
  S.cfg={mode,name:st.name,city:st.city||"",fsid,min,where:(S.where||"").trim(),cartId:S.cfg&&S.cfg.fsid===fsid?S.cfg.cartId:null};
  ls.set("shopcfg",S.cfg);S.stage="list";S.stores=null;S.busy="";S.done=null;S.anchor=true;
  if(S.pendingFav!=null){const F=favs(),f=F[S.pendingFav];if(f&&!f.fsid){F[S.pendingFav]={...S.cfg,label:f.label};ls.set("shopfavs",F)}S.pendingFav=null}
  S.items.forEach(x=>{x.opts=[];x.pick=0});
  renderShop();loadProducts();
}
async function loadProducts(){
  const S=shop,c=S.cfg;if(!c||!mcp)return;
  S.busy="search";renderShop();
  try{await cf("set_pickup_mode",{pickup_mode:c.mode},true)}catch{}
  if(sample&&S.items.some(x=>!x.kw)){
    try{
      const out=await sample.json(`Pour chaque ingrédient de recette, donne le mot-clé à taper dans la recherche d'un supermarché Carrefour pour trouver le produit à acheter : le nom du produit seul, simple et générique (ex. « 200 g de lardons fumés » -> "lardons fumés", « jaunes d'œufs » -> "oeufs", « parmesan râpé » -> "parmesan"), sans quantité, sans mots de liaison ni format. Mets null si ça ne s'achète pas (eau, sel, poivre).
Ingrédients :
${S.items.map((x,i)=>`${i}. ${x.src||x.nom}`).join("\n")}
Donne aussi pour chacun l'emoji d'aliment qui le représente le mieux (🍝 🥓 🥚 🧀 🧈 🥛 🍅 🧅 🧄 🥕 🍋 🍗 🐟 🍚 🌿 🍫 🍓 🍎 🫒 …).
Les mots-clés sont toujours en français (le magasin est en France), même si l'ingrédient est écrit dans une autre langue.
Réponds UNIQUEMENT avec ce JSON : {"kw":[ une chaîne ou null par ingrédient, dans l'ordre ], "emo":[ un emoji par ingrédient, dans l'ordre ]}`,{modelTier:"quick",noLang:true});
      arr(out?.kw).forEach((k,i)=>{if(S.items[i])S.items[i].kw=k===null?"":String(k||"")});
      arr(out?.emo).forEach((e,i)=>{if(S.items[i]&&typeof e==="string"&&e.length<=8)S.items[i].emo=e});
    }catch{}
  }
  S.items.forEach(x=>{if(x.kw==null)x.kw=x.src||x.nom;if(x.kw==="")x.on=false});
  const todo=S.items.filter(x=>x.kw);let k=0,fail=0;
  await Promise.all([0,1,2,3].map(async()=>{
    while(k<todo.length){const x=todo[k++];
      try{const out=await cf("search_products",{keyword:x.kw,limit:6,facility_service_id:c.fsid,service_type:c.mode});
        x.opts=arr(findKey(out,"products")).filter(p=>p&&p.gtin);x.pick=0}
      catch(e){fail++;if(!S.err)S.err=cfErr(e)}
      if(shop===S)renderShop();
    }
  }));
  if(shop!==S)return;
  if(!fail)S.err="";
  S.busy="";renderShop();
}

async function addCart(){
  const S=shop,c=S.cfg;
  const chosen=S.items.filter(x=>x.on&&x.opts[x.pick]);if(!chosen.length)return;
  S.busy="cart";renderShop();
  const input={products:chosen.map(x=>{const p=x.opts[x.pick];return {gtin:String(p.gtin),quantity:x.qty,...(p.packaging?{packaging:p.packaging}:{})}}),facility_service_id:c.fsid,service_type:c.mode,store_name:c.name};
  let out;
  try{out=await cf("add_to_cart",c.cartId?{...input,cart_id:c.cartId}:input,true)}
  catch(e){
    if(c.cartId){try{out=await cf("add_to_cart",input,true)}catch(e2){S.err=cfErr(e2);S.busy="";return renderShop()}}
    else{S.err=cfErr(e);S.busy="";return renderShop()}
  }

  S.busy="";renderShop();
}

const VARIANTS={

  healthy:{suffix:"version healthy",label:"Version healthy",rules:`Adapte-la pour la rendre plus saine et plus légère, en gardant l'esprit et le goût du plat :
- réduis nettement les calories et les graisses saturées par portion (viser environ -30 % de kcal) : moins de beurre, de crème, de fromage et de sucre, cuissons plus légères (four plutôt que friture), remplacements malins (yaourt grec ou skyr à la place de crème, huile d'olive à la place du beurre quand ça marche, farine complète, moins de sucre et plus d'épices ou de vanille) ;

/* ---------- mon carnet : les fois où je l'ai faite, et ma note pour la prochaine fois ---------- */
const DAY=864e5,sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
function whenTxt(t){
  const d=Math.round((new Date().setHours(0,0,0,0)-new Date(t).setHours(0,0,0,0))/DAY);
  if(d<=0)return L("aujourd'hui","today");if(d===1)return L("hier","yesterday");
  const date=new Date(t).toLocaleDateString(EN()?"en-GB":"fr-FR",{day:"numeric",month:"long",...(new Date(t).getFullYear()!==new Date().getFullYear()?{year:"numeric"}:{})});
  return d<7?L(`il y a ${d} jours`,`${d} days ago`):L(`le ${date}`,`on ${date}`);
}
function journalHTML(r){
  const raw=r._raw||r,F=arr(raw.faite).filter(Number.isFinite).sort((a,b)=>b-a),n=F.length,today=n&&sameDay(F[0],Date.now());
  return `<section class="block journal"><div class="jh"><h2>${L("Mon carnet","My notes")}</h2><span class="hand">${n?L(`faite ${n} fois`,`made ${n} time${n>1?"s":""}`):L("pas encore faite","not made yet")}</span></div>
    ${n?`<p class="jlast">${emo("🍽️")} ${L("La dernière fois","Last time")} : ${esc(whenTxt(F[0]))}${n>1?` <span class="muted">· ${L("avant","before that")} ${esc(whenTxt(F[1]))}</span>`:""}</p>`:""}
    <textarea id="maNote" rows="2" placeholder="${L("Pour la prochaine fois : un peu moins de sucre, 5 min de cuisson en plus…","For next time: a little less sugar, 5 more minutes in the oven…")}">${esc(raw.maNote||"")}</textarea>
    <div class="row" style="gap:.5rem">${today?`<span class="jdone">${emo("✓")} ${L("Faite aujourd'hui","Made today")}</span><button class="linkbtn" id="faiteUndo">${L("Retirer","Remove")}</button>`:`<button class="btn soft" id="faite">${emo("✓")} ${L("Je l'ai faite aujourd'hui","I made it today")}</button>`}</div>
  </section>`;
}
async function markMade(r,on){
  const raw=recRaw.find(x=>x.id===r.id);if(!raw||!db)return false;
  let F=arr(raw.faite).filter(Number.isFinite);
  if(on){if(F.some(t=>sameDay(t,Date.now())))return true;F=[...F,Date.now()]}else F=F.filter(t=>!sameDay(t,Date.now()));
  try{await db.collection("recettes").doc(r.id).update({faite:F});raw.faite=F;return true}catch{return false}
}

async function famSync(){

  const key="famsync."+famille.id,cache=ls.get(key,{})||{},seen=new Set();

      seen.add(r.id);

      rec.etapes=arr(rec.etapes).map(({image,...e})=>e);
      const h=hstr(JSON.stringify(rec)+"|"+(photo||"")+"|"+prenomMoi());if(cache[id]===h)continue;

let ck={r:null,i:0,t:null,left:0,run:false};
// "make only one part": the named ingredient groups, and the steps that belong to each
const partsOf=r=>arr(r.ingredients).map((g,i)=>({i,n:String(g.groupe||"").trim()})).filter(g=>g.n&&arr(r.ingredients[g.i].items).length);
function stepsOfPart(r,gi){
  const g=arr(r.ingredients)[gi],gn=norm(g.groupe).replace(/^(pour |la |le |les |l')+/,"").trim();
  const words=arr(g.items).map(i=>norm(i.nom).split(/\s+/).filter(w=>w.length>=4)).flat();
  const others=arr(r.ingredients).filter((x,k)=>k!==gi).map(x=>norm(x.groupe));
  const tagged=arr(r.etapes).some(e=>e.partie);
  const keep=arr(r.etapes).map(e=>{
    if(tagged)return norm(e.partie||"")===norm(g.groupe);
    const t=norm(e.titre+" "+e.texte+" "+arr(e.ingredients).join(" "));
    if(gn&&t.includes(gn))return true;
    return arr(e.ingredients).length?arr(e.ingredients).some(x=>words.some(w=>norm(x).includes(w))):false;
  });
  const out=arr(r.etapes).filter((e,k)=>keep[k]);
  return out.length?out:arr(r.etapes);
}
// the recipe reduced to one part; empty groups keep the ingredient indices (ticks, shopping list)
const onlyPart=(r,gi)=>gi==null?r:{...r,ingredients:arr(r.ingredients).map((g,k)=>k===gi?g:{...g,items:[]}),etapes:stepsOfPart(r,gi),titre:r.titre};

function drawCook(){

      ${ck.left&&ck.ts!==ck.i?`<div class="timer"><b id="tm">${mm+":"+ss}</b><button id="tmBtn">${ck.run?"Pause":"Reprendre"}</button><span class="muted">${L("Étape","Step")} ${ck.ts+1}</span></div>`:e.duree_min?`<div class="timer"><b id="tm">${ck.left||ck.run?mm+":"+ss:mins(e.duree_min)}</b><button id="tmBtn">${ck.run?"Pause":(ck.left?"Reprendre":"Minuteur")}</button></div>`:""}

  const tb=$("#tmBtn");if(tb)tb.onclick=()=>toggleTimer(e.duree_min);

  if(vv&&seg){
    vv.muted=true;
    const cuts=arr(r.videoCut),inCut=t=>cuts.find(c=>t>=c[0]&&t<c[1]-.05),go=()=>{try{vv.currentTime=seg[0]}catch{};vv.play().catch(()=>{})};

    $("#ckRe").onclick=go;

// [start, end] in seconds of step i in the recipe's video, or null
function vSeg(r,i){
  if(!r.videoAsset)return null;const st=arr(r.etapes),t0=st[i]?.t0;if(t0==null)return null;
  const nx=st.slice(i+1).find(e=>e.t0!=null&&e.t0>t0);let a=t0;const b=nx?nx.t0:(r.videoDur||t0+20);

  for(const c of arr(r.videoCut))if(a>=c[0]&&a<c[1])a=c[1];
  return a<b-.3?[a,b]:null;
}

  {sel:"#cookGo",k:["Recette","Recipe"],t:["Le mode cuisine","Cooking mode"],d:["Une étape à la fois, en grand, avec minuteur.","One step at a time, in big type, with a timer."],go:["Compris","Got it"]}
];
let tour=null;
const tourEl=sel=>{if(!sel)return null;const e=typeof sel==="function"?sel():document.querySelector(sel);if(!e)return null;const b=e.getBoundingClientRect();return b.width||b.height?e:null};
function startTour(steps,key){
  if(tour)return;
  tour={steps:steps.filter(x=>!x.when||x.when()),key,i:0};
  const o=document.createElement("div");o.id="tour";o.dataset.notr="1";o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");
  o.innerHTML=`<div class="tour-hole"></div><div class="tour-bub" aria-live="polite"></div>`;
  document.body.appendChild(o);document.body.style.overflow="hidden";
  o.addEventListener("click",ev=>{const b=ev.target.closest("[data-tour]");if(!b)return;b.dataset.tour==="skip"?endTour():tourStep(tour.i+1)});
  tourStep(0);
}
function endTour(){if(!tour)return;tutoMark(tour.key,1);const sheetOpen=!$("#sheet").hidden;tour=null;$("#tour")?.remove();document.body.style.overflow=sheetOpen?"hidden":""}
function tourStep(i){
  if(!tour)return;
  const steps=tour.steps;
  if(i>=steps.length)return endTour();
  const s=steps[i];tour.i=i;
  if(s.tab&&st.view!==s.tab){st.view=s.tab;render();window.scrollTo(0,0)}
  const el=tourEl(s.sel);
  if(s.sel&&!el)return tourStep(i+1);
  if(el)el.scrollIntoView({block:"center",behavior:"instant"});
  setTimeout(()=>tourDraw(s,el,i),el?80:0);
}
function tourDraw(s,el,i){
  const o=$("#tour");if(!o||!tour)return;
  const hole=o.querySelector(".tour-hole"),bub=o.querySelector(".tour-bub");
  const n=tour.steps.length,last=i===n-1;
  bub.innerHTML=`<div class="tour-k">${esc(L(...s.k))}</div><h3>${esc(L(...s.t))}</h3><p>${esc(L(...s.d))}</p>
    <div class="tour-f"><span class="tour-prog" aria-label="${i+1} / ${n}"><i style="width:${Math.round((i+1)/n*100)}%"></i></span>
    ${last?"":`<button class="tour-skip" data-tour="skip">${L("Passer","Skip")}</button>`}<button class="tour-next" data-tour="next">${esc(s.go?L(...s.go):L("Suivant","Next"))}</button></div>`;
  const W=innerWidth,H=innerHeight,pad=8;
  if(el){
    const b=(s.up?el.parentElement:el).getBoundingClientRect(),x=Math.max(6,b.left-pad),y=Math.max(6,b.top-pad),w=Math.min(W-12,b.width+pad*2),h=b.height+pad*2;
    hole.classList.remove("none");Object.assign(hole.style,{left:x+"px",top:y+"px",width:w+"px",height:h+"px",opacity:1,borderRadius:Math.min(22,h/2)+"px"});
    const bw=Math.min(340,W-32);bub.classList.remove("center");bub.style.width=bw+"px";bub.style.left=Math.round((W-bw)/2)+"px";
    const bh=bub.offsetHeight,below=y+h+14;
    bub.style.top=(below+bh<H-12?below:Math.max(12,y-bh-14))+"px";
  }else{
    hole.classList.add("none");Object.assign(hole.style,{left:W/2+"px",top:H/2+"px",width:"0px",height:"0px",opacity:1});
    const bw=Math.min(340,W-32);bub.classList.add("center");bub.style.width=bw+"px";bub.style.left=Math.round((W-bw)/2)+"px";
    bub.style.top=Math.round((H-bub.offsetHeight)/2)+"px";
  }
}
addEventListener("resize",()=>{if(tour)tourStep(tour.i)});
document.addEventListener("keydown",ev=>{if(!tour)return;if(ev.key==="Escape")endTour();else if(ev.key==="ArrowRight"||ev.key==="Enter"){ev.preventDefault();tourStep(tour.i+1)}});
let tourAsked=false,tutoDb=null;
const tutoSeen=k=>ls.get(k,0)||tutoDb?.[k];
function tutoMark(k,v){ls.set(k,v);tutoDb={...(tutoDb||{}),[k]:v};if(db)db.collection("reglages").doc("tuto").set(tutoDb).catch(()=>{})}
function maybeTour(){
  if(tourAsked||tour||tutoSeen("tuto_v1")||!ready.db||(db&&(!loaded||!tutoDb)))return;
  tourAsked=true;setTimeout(()=>{if(!tour&&!tutoSeen("tuto_v1")&&$("#sheet").hidden)startTour(TOUR_MAIN,"tuto_v1")},500);
}
function maybeRecipeTour(){
  if(tour||tutoSeen("tuto_recette")||(db&&!tutoDb))return;
  setTimeout(()=>{if(!tour&&!$("#sheet").hidden&&!tutoSeen("tuto_recette"))startTour(TOUR_RECIPE,"tuto_recette")},450);
}

/* ---------- toast ---------- */
const APP_URL="https://tulliodisegni-art.github.io/Mijonote/";
/* partage de l'appli réservé au propriétaire (code propriétaire, empreinte ci-dessous) ; la version Claude est la sienne */
const OWNER_H="63fda2eab9893320e9e13b672e032351a66650386c54f3f430a19d37165aaffd";
function isOwner(){return !window.MJ_PWA||ls.get("mj_owner",false)===true||!!(window.Gate&&window.Gate.isOwner())}
async function ownerCode(code){const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("owner:"+String(code||"").trim()));
  const h=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");if(h!==OWNER_H)return false;ls.set("mj_owner",true);return true}
{const q=new URLSearchParams(location.search).get("proprio");if(q)ownerCode(q).finally(()=>{try{history.replaceState(null,"",location.pathname+location.hash)}catch{}})}
async function shareApp(custom){if(!isOwner())return;if(window.Gate){window.Gate.invite();return}
  const text=custom||L("Mijonote, mon carnet de recettes : photographie tes livres et les recettes de tes proches, Claude les range pour toi. Ouvre le lien puis ajoute-le à ton écran d'accueil.","Mijonote, my recipe notebook: snap your cookbooks and family recipes, Claude files them for you. Open the link, then add it to your home screen.");
  if(navigator.share){try{await navigator.share({title:"Mijonote",text,url:APP_URL});return}catch(e){if(e?.name==="AbortError")return}}
  try{await navigator.clipboard.writeText(text+" "+APP_URL);toast(L("Lien copié : colle-le dans un message","Link copied: paste it in a message"))}
  catch{prompt(L("Copie ce lien :","Copy this link:"),APP_URL)}
}
// a short message; with an action (« Annuler ») it stays a little longer and the button runs it once
function toast(m,act){
  let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.setAttribute("role","status");
    t.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 104px);background:var(--ink);color:var(--bg);padding:.6rem 1.1rem;border-radius:999px;font-weight:600;z-index:60;font-size:.92rem;max-width:90vw;display:flex;align-items:center;gap:.9rem";document.body.appendChild(t)}
  t.textContent=m;t.hidden=false;clearTimeout(t._h);
  if(act){const b=document.createElement("button");b.textContent=act.label||L("Annuler","Undo");b.style.cssText="border:0;background:none;color:var(--glow-saffron,#ffd9b8);font:inherit;font-weight:800;padding:.1rem 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px";
    b.onclick=()=>{t.hidden=true;clearTimeout(t._h);act.fn()};t.appendChild(b)}
  t._h=setTimeout(()=>t.hidden=true,act?(act.ms||6000):2400);
}
// deletes a document and offers to bring it back for a few seconds
async function delWithUndo(col,id,data,msg,after){
  await db.collection(col).doc(id).delete();
  toast(msg,{fn:async()=>{try{await db.collection(col).doc(id).set(data);toast(L("C'est revenu","It's back"));after&&after()}catch{toast(L("Impossible de le remettre","Couldn't bring it back"))}}});
}
render();
